spring.application.name=associacao-gaia-api
# =====================================================================
# CONFIGURACAO DO BANCO DE DADOS - ASSOCIACAO GAIA
# =====================================================================
#
# Banco definido pela equipe: MySQL.
#
# Antes de rodar o projeto, crie o banco no seu MySQL (uma unica vez):
#   CREATE DATABASE associacao_gaia;
#
# Troque "sua_senha_aqui" pela senha do seu usuario root do MySQL (ou de
# outro usuario que voce tenha criado especificamente para o projeto).
# =====================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/associacao_gaia?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=La18032203@.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# "update": o Hibernate cria/ajusta as tabelas sozinho, a partir das entidades Java.
# Isso poupa a gente de escrever o SQL das tabelas na mao por enquanto.
spring.jpa.hibernate.ddl-auto=update

# Mostra no console o SQL que o Hibernate esta executando (bom para aprender/depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
